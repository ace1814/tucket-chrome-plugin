<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screenshot — Tucket Grab</title>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="capture.css">
  <script src="../shared/send.js"></script>
  <script src="../shared/footer.js"></script>
  <script type="module" src="capture.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand"><img src="../../icons/icon-32.png" alt="" width="20" height="20"><span>Tucket Grab</span></div>
    <div class="page">
      <strong id="page-title">Screenshot</strong>
      <span id="page-meta"></span>
    </div>
    <div class="top-actions" id="top-actions" hidden>
      <button type="button" class="btn primary" id="send-first">Send to Tucket</button>
      <button type="button" class="btn" id="save-all">Save PNG</button>
    </div>
  </header>

  <ul class="notes" id="notes" hidden></ul>
  <p class="missing" id="missing" hidden>This screenshot is no longer available. Captures are kept on this computer for a day.</p>

  <main id="parts"></main>

  <footer class="tg-footer" id="footer"></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
