<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App shell with a scrolling panel</title>
<!-- Gemini-shaped: the window never scrolls. A sidebar and a top bar frame a middle panel that
     scrolls, with a composer pinned underneath. A full-page capture must keep the whole window. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 16px/1.6 system-ui, sans-serif; color: #e8eaed; background: #131314; }
  .shell { display: grid; grid-template-columns: 260px 1fr; height: 100%; }
  aside { background: #1e1f20; padding: 20px; }
  .col { display: grid; grid-template-rows: 56px 1fr 80px; height: 100%; min-height: 0; }
  .topbar { background: #1b1c1d; display: flex; align-items: center; padding: 0 24px; font-weight: 600; }
  main { overflow-y: auto; padding: 0 40px; }
  .composer { background: #1e1f20; margin: 12px 40px 16px; border-radius: 24px; display: flex; align-items: center; padding: 0 20px; color: #9aa0a6; }
  .turn { min-height: 700px; border-bottom: 1px solid #2c2d2f; display: flex; align-items: center; font-size: 34px; }
  .turn:nth-child(even) { background: #17181a; }
</style>
</head>
<body>
  <div class="shell">
    <aside>Sidebar · chats</aside>
    <div class="col">
      <div class="topbar">App top bar</div>
      <main>
        <div class="turn">Answer 1</div>
        <div class="turn">Answer 2</div>
        <div class="turn">Answer 3</div>
        <div class="turn">Answer 4 — end</div>
      </main>
      <div class="composer">Ask anything…</div>
    </div>
  </div>
</body>
</html>
