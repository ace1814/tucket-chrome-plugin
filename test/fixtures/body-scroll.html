<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Body scroller</title>
<!-- The window is locked and <body> itself is the scroller, as some app-style pages (LinkedIn's
     logged-in views among them) set up html/body. A tool that only looks for scrolling elements
     inside <body>, or trusts documentElement.scrollHeight, captures one screen. Each band has
     its own colour so the capture can be checked from top to bottom. -->
<style>
  html { height: 100%; overflow: hidden; }
  body { height: 100%; margin: 0; overflow-y: auto; font: 16px/1.5 system-ui, sans-serif; }
  .band { height: 600px; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 700; color: #fff; }
</style>
</head>
<body>
  <div class="band" style="background:#c0392b">1</div>
  <div class="band" style="background:#27ae60">2</div>
  <div class="band" style="background:#2980b9">3</div>
  <div class="band" style="background:#8e44ad">4</div>
  <div class="band" style="background:#d35400">5 — the end</div>
</body>
</html>
